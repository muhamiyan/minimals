services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      MIGRATE_ON_BOOT: "true"
      TRUSTED_PROXY: "true"
      FORCE_HTTPS: "true"
    # The bind mount below is owned by the host user, so the container has to
    # run as that uid or ./data is unwritable and boot fails on data/app.log.
    # APP_UID feeds both the image owner (uploads/) and the runtime user.
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
